      <rect x="10" y="13" width="12" height="8" fill="#1976d2" stroke="#222222" stroke-width="2"/>
      <!-- Bucket mouth highlight -->
      <rect x="10" y="13" width="12" height="2" fill="#b3e0ff" stroke="#222222" stroke-width="0.5"/>
    </g>
    <!-- Color drops from mouth (flipped) -->
    <ellipse cx="26" cy="15" rx="1.5" ry="0.8" fill="#51ff8b"/>
    <ellipse cx="27.5" cy="16.5" rx="1" ry="0.6" fill="#ffb451ff"/>
    <ellipse cx="28" cy="18" rx="0.8" ry="0.4" fill="#ff0000ff" />

  </g>
</svg>